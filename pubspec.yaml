name: native_macos
description: >-
  Real AppKit controls and Liquid Glass for Flutter on macOS: a native
  toolbar, glass surfaces, buttons, switches, sliders, and menus drawn by the OS.
version: 0.2.1
homepage: https://seungpyo.online
repository: https://github.com/Seungpyo1007/native_macos
issue_tracker: https://github.com/Seungpyo1007/native_macos/issues
topics:
  - macos
  - liquid-glass
  - appkit
  - native
  - widget
screenshots:
  - description: A native NSToolbar and AppKit controls in light and dark mode on macOS 27.
    path: assets/native_macos-showcase.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Native views exist only on macOS; other platforms render the fallback.
platforms:
  macos:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: NativeMacosPlugin
